<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Word Route — write a word, ride it</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ --ink:#14181f; --ink2:#1e242e; --line:#2f3745; --txt:#eef1f5; --mute:#98a2b3; --hot:#ff4d2e; --ok:#3ddc97; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  html,body{overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #map{flex:1;min-height:160px;background:#dfe5ea}
  #top{position:absolute;z-index:1000;top:max(10px,env(safe-area-inset-top));left:54px;right:10px;display:flex;gap:6px;max-width:420px}
  #top input{flex:1;min-width:0}
  input[type=text],input[type=search]{background:#fff;color:#111;border:0;border-radius:10px;padding:10px 12px;font-size:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.25)}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--txt);background:var(--ink2);
    border:1px solid var(--line)}
  button.primary{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:700}
  button:disabled{opacity:.45;cursor:default}
  #top button{background:#fff;color:#111;border:0;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  #panel{background:var(--ink);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:grid;gap:8px;flex:none;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .row{display:flex;gap:8px;align-items:center;min-width:0}
  #word{flex:1;min-width:0;font-weight:800;letter-spacing:.12em;text-transform:uppercase;box-shadow:none;-webkit-user-select:text;user-select:text}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .seg button{border:0;border-radius:0;background:transparent;padding:10px 12px;color:var(--mute)}
  .seg button.on{background:var(--txt);color:var(--ink);font-weight:700}
  label{display:grid;grid-template-columns:76px minmax(0,1fr) 58px;gap:8px;align-items:center;color:var(--mute);font-size:13px;height:24px}
  label output{color:var(--txt);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  input[type=range]{width:100%;margin:0;accent-color:var(--hot);touch-action:pan-x}
  .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .actions button{padding:11px 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result{display:flex;gap:8px;align-items:center;min-width:0}
  .info{flex:1;min-width:0;height:54px;overflow:hidden}
  #stats{font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;font-size:14px;height:20px;line-height:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status{font-size:13px;line-height:17px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #status.err{color:#ff8f7a}
  #gpx{flex:none;padding:11px 14px}
  .grow{flex:1}
  .handle{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;
    font-size:18px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  @media (min-width:860px), (orientation:landscape) and (min-width:560px){
    #app{flex-direction:row-reverse}
    #map{min-height:0}
    #panel{width:min(360px,45vw);border-top:0;border-right:1px solid var(--line);align-content:start;padding:18px;gap:12px;
      padding-left:max(18px,env(safe-area-inset-left));overflow-y:auto}
    .info{height:auto;min-height:54px}
    #stats{white-space:normal;height:auto}
    #status{display:block}
    #top{left:auto;right:14px}
  }
  @media (orientation:landscape) and (max-height:500px){
    #panel{padding:10px 12px;gap:8px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <form id="top">
    <input id="place" type="search" placeholder="Go to city or area…" autocomplete="off">
    <button type="submit">Go</button>
  </form>
  <div id="panel">
    <div class="row">
      <input id="word" type="text" maxlength="14" value="ΑΘΗΝΑ" placeholder="Your word" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="seg" id="mode">
        <button type="button" data-m="run" class="on">Run</button>
        <button type="button" data-m="bike">Bike</button>
      </div>
    </div>
    <label>Letter size <input id="size" type="range" min="200" max="3000" step="50" value="700"><output id="sizeO"></output></label>
    <label>Rotation <input id="rot" type="range" min="-90" max="90" step="1" value="0"><output id="rotO"></output></label>
    <div class="actions">
      <button type="button" id="here" title="Move the word to the middle of the map">Move here</button>
      <button type="button" id="tune" disabled>Improve fit</button>
      <button type="button" id="go" class="primary">Make route</button>
    </div>
    <div class="result">
      <div class="info"><div id="stats"></div><div id="status">Drag the ✥ handle to place the word, then make the route.</div></div>
      <button type="button" id="gpx" disabled>GPX ↓</button>
    </div>
  </div>
</div>

<script>
/*CORE-START*/
const R = 6371000, RAD = Math.PI / 180;

// ---------- single-stroke font (box: 2 wide x 4 tall; strokes separated by |) ----------
const FONT_SRC = {
  A:"0,0 1,4 2,0 1.5,2 .5,2", B:"0,0 0,4 1.5,4 2,3.5 2,2.5 1.5,2 0,2 1.5,2 2,1.5 2,.5 1.5,0 0,0",
  C:"2,3.5 1.5,4 .5,4 0,3.5 0,.5 .5,0 1.5,0 2,.5", D:"0,0 0,4 1.2,4 2,3 2,1 1.2,0 0,0",
  E:"2,4 0,4 0,2 1.5,2 0,2 0,0 2,0", F:"2,4 0,4 0,2 1.5,2 0,2 0,0",
  G:"2,3.5 1.5,4 .5,4 0,3.5 0,.5 .5,0 1.5,0 2,.5 2,2 1,2", H:"0,4 0,0 0,2 2,2 2,4 2,0",
  I:"0,4 0,0", J:"0,1 0,.5 .5,0 1.5,0 2,.5 2,4", K:"0,4 0,0 0,2 2,4 0,2 2,0", L:"0,4 0,0 2,0",
  M:"0,0 0,4 1.2,2 2.4,4 2.4,0", N:"0,0 0,4 2,0 2,4",
  O:".5,0 0,.5 0,3.5 .5,4 1.5,4 2,3.5 2,.5 1.5,0 .5,0", P:"0,0 0,4 1.5,4 2,3.5 2,2.5 1.5,2 0,2",
  Q:"1.5,0 .5,0 0,.5 0,3.5 .5,4 1.5,4 2,3.5 2,.5 1.5,0 1.1,.9 2,0",
  R:"0,0 0,4 1.5,4 2,3.5 2,2.5 1.5,2 0,2 1,2 2,0",
  S:"2,3.5 1.5,4 .5,4 0,3.5 0,2.5 .5,2 1.5,2 2,1.5 2,.5 1.5,0 .5,0 0,.5",
  T:"0,4 2,4 1,4 1,0", U:"0,4 0,.5 .5,0 1.5,0 2,.5 2,4", V:"0,4 1,0 2,4", W:"0,4 .6,0 1.2,2.5 1.8,0 2.4,4",
  X:"0,4 2,0 1,2 2,4 0,0", Y:"0,4 1,2 2,4 1,2 1,0", Z:"0,4 2,4 0,0 2,0",
  "0":".5,0 0,.5 0,3.5 .5,4 1.5,4 2,3.5 2,.5 1.5,0 .5,0", "1":".3,3 1,4 1,0", "2":"0,3.5 .5,4 1.5,4 2,3.5 2,2.5 0,0 2,0",
  "3":"0,3.5 .5,4 1.5,4 2,3.5 2,2.5 1.5,2 .7,2 1.5,2 2,1.5 2,.5 1.5,0 .5,0 0,.5", "4":"1.5,0 1.5,4 0,1.3 2,1.3",
  "5":"2,4 0,4 0,2.2 1.5,2.2 2,1.7 2,.5 1.5,0 .5,0 0,.5",
  "6":"2,3.5 1.5,4 .5,4 0,3.5 0,.5 .5,0 1.5,0 2,.5 2,1.7 1.5,2.2 0,2.2", "7":"0,4 2,4 .7,0",
  "8":".5,2 0,2.5 0,3.5 .5,4 1.5,4 2,3.5 2,2.5 1.5,2 .5,2 0,1.5 0,.5 .5,0 1.5,0 2,.5 2,1.5 1.5,2",
  "9":"0,.5 .5,0 1.5,0 2,.5 2,3.5 1.5,4 .5,4 0,3.5 0,2.3 .5,1.8 2,1.8",
  "♥":"1,0 0,2.4 0,3.4 .5,4 1,3.4 1.5,4 2,3.4 2,2.4 1,0", "-":".2,2 1.8,2",
  // Greek-only shapes
  "Γ":"0,0 0,4 2,4", "Δ":"0,0 1,4 2,0 0,0",
  "Θ":".5,0 0,.5 0,2 2,2 0,2 0,3.5 .5,4 1.5,4 2,3.5 2,.5 1.5,0 .5,0",
  "Λ":"0,0 1,4 2,0", "Ξ":"0,4 2,4|1.7,2 .3,2|0,0 2,0", "Π":"0,0 0,4 2,4 2,0", "Σ":"2,4 0,4 1,2 0,0 2,0",
  "Φ":"1,0 1,4 1,3.2 .4,3.2 0,2.8 0,1.2 .4,.8 1.6,.8 2,1.2 2,2.8 1.6,3.2 1,3.2",
  "Ψ":"0,4 0,2.5 .5,2 1.5,2 2,2.5 2,4 2,2.5 1.5,2 1,2 1,4 1,0",
  "Ω":"0,0 .7,0 .7,.6 0,1.5 0,3.3 .6,4 1.4,4 2,3.3 2,1.5 1.3,.6 1.3,0 2,0"
};
const GREEK_SAME = {"Α":"A","Β":"B","Ε":"E","Ζ":"Z","Η":"H","Ι":"I","Κ":"K","Μ":"M","Ν":"N","Ο":"O","Ρ":"P","Τ":"T","Υ":"Y","Χ":"X"};
const FONT = {};
for (const ch in FONT_SRC) {
  const strokes = FONT_SRC[ch].split("|").map(s => s.trim().split(/\s+/).map(p => p.split(",").map(Number)));
  let w = 0; for (const s of strokes) for (const p of s) w = Math.max(w, p[0]);
  FONT[ch] = { strokes, w };
}
for (const g in GREEK_SAME) FONT[g] = FONT[GREEK_SAME[g]];

function normalizeWord(t) {
  return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/<3/g, "♥");
}
// Returns strokes in font units, centred on (0,0), plus list of unsupported characters.
function layoutWord(text) {
  const GAP = 1, SPACE = 1.4;
  let x = 0; const strokes = [], skipped = [];
  for (const ch of normalizeWord(text)) {
    if (ch === " ") { x += SPACE; continue; }
    const g = FONT[ch];
    if (!g) { skipped.push(ch); continue; }
    for (const s of g.strokes) strokes.push(s.map(p => [p[0] + x, p[1]]));
    x += g.w + GAP;
  }
  const W = Math.max(0, x - GAP);
  for (const s of strokes) for (const p of s) { p[0] -= W / 2; p[1] -= 2; }
  return { strokes, width: W, skipped };
}
// Font units -> lat/lon around a centre, letter height H metres, rotation in degrees (clockwise).
function placeStrokes(strokes, c, H, rotDeg) {
  const k = H / 4, a = -rotDeg * RAD, ca = Math.cos(a), sa = Math.sin(a), cl = Math.cos(c.lat * RAD);
  return strokes.map(s => s.map(p => {
    const x = p[0] * k, y = p[1] * k, xr = x * ca - y * sa, yr = x * sa + y * ca;
    return [c.lat + yr / R / RAD, c.lng + xr / (R * cl) / RAD];
  }));
}

// ---------- road graph ----------
function buildGraph(elements) {
  const idIndex = new Map(), lat = [], lon = [], eu = [], ev = [];
  for (const el of elements) {
    if (el.type !== "way" || !el.nodes || !el.geometry) continue;
    let prev = -1;
    for (let i = 0; i < el.nodes.length; i++) {
      const gm = el.geometry[i];
      if (!gm) { prev = -1; continue; }
      let k = idIndex.get(el.nodes[i]);
      if (k === undefined) { k = lat.length; idIndex.set(el.nodes[i], k); lat.push(gm.lat); lon.push(gm.lon); }
      if (prev >= 0 && prev !== k) { eu.push(prev); ev.push(k); }
      prev = k;
    }
  }
  const n = lat.length;
  if (!n) return null;
  let la0 = 0, lo0 = 0;
  for (let i = 0; i < n; i++) { la0 += lat[i]; lo0 += lon[i]; }
  la0 /= n; lo0 /= n;
  const cl = Math.cos(la0 * RAD);
  const toXY = (la, lo) => [(lo - lo0) * RAD * R * cl, (la - la0) * RAD * R];
  const X = new Float64Array(n), Y = new Float64Array(n);
  for (let i = 0; i < n; i++) { const p = toXY(lat[i], lon[i]); X[i] = p[0]; Y[i] = p[1]; }
  // CSR adjacency (undirected)
  const m = eu.length, deg = new Int32Array(n + 1);
  for (let i = 0; i < m; i++) { deg[eu[i] + 1]++; deg[ev[i] + 1]++; }
  for (let i = 0; i < n; i++) deg[i + 1] += deg[i];
  const off = deg, fill = off.slice(0, n), to = new Int32Array(2 * m), len = new Float64Array(2 * m);
  for (let i = 0; i < m; i++) {
    const u = eu[i], v = ev[i], d = Math.hypot(X[u] - X[v], Y[u] - Y[v]);
    to[fill[u]] = v; len[fill[u]++] = d; to[fill[v]] = u; len[fill[v]++] = d;
  }
  // largest connected component
  const comp = new Int32Array(n).fill(-1); let best = -1, bestSize = 0, nc = 0; const stack = [];
  for (let s = 0; s < n; s++) {
    if (comp[s] >= 0) continue;
    let size = 0; comp[s] = nc; stack.push(s);
    while (stack.length) { const u = stack.pop(); size++;
      for (let e = off[u]; e < off[u + 1]; e++) { const v = to[e]; if (comp[v] < 0) { comp[v] = nc; stack.push(v); } } }
    if (size > bestSize) { bestSize = size; best = nc; }
    nc++;
  }
  // spatial hash of usable nodes
  const CELL = 120, grid = new Map();
  for (let i = 0; i < n; i++) {
    if (comp[i] !== best) continue;
    const key = Math.floor(X[i] / CELL) + "," + Math.floor(Y[i] / CELL);
    let a = grid.get(key); if (!a) grid.set(key, a = []); a.push(i);
  }
  function nearest(x, y) {
    const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
    let bi = -1, bd = Infinity;
    for (let r = 0; r <= 8; r++) {
      for (let i = cx - r; i <= cx + r; i++) for (let j = cy - r; j <= cy + r; j++) {
        if (Math.max(Math.abs(i - cx), Math.abs(j - cy)) !== r) continue;
        const a = grid.get(i + "," + j); if (!a) continue;
        for (const k of a) { const d = (X[k] - x) ** 2 + (Y[k] - y) ** 2; if (d < bd) { bd = d; bi = k; } }
      }
      if (bi >= 0 && Math.sqrt(bd) <= r * CELL) break;
    }
    return bi;
  }
  return { n, lat, lon, X, Y, off, to, len, toXY, nearest,
    dist: new Float64Array(n), prev: new Int32Array(n), stamp: new Int32Array(n), tick: 0 };
}

function distPointSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}

// Dijkstra. With seg=[ax,ay,bx,by] edges are penalised by their distance from that ideal line,
// so the path hugs the letter stroke instead of taking the shortest way.
function shortest(g, src, dst, seg, sigma, cutoff) {
  const { X, Y, off, to, len, dist, prev, stamp } = g, T = ++g.tick, tx = X[dst], ty = Y[dst];
  const h = v => Math.hypot(X[v] - tx, Y[v] - ty);
  const hk = [h(src)], hn = [src];
  dist[src] = 0; prev[src] = -1; stamp[src] = T;
  while (hn.length) {
    const d = hk[0], u = hn[0], lk = hk.pop(), ln = hn.pop();
    if (hn.length) { // sift down
      let i = 0; const N = hn.length;
      for (;;) { let c = 2 * i + 1; if (c >= N) break; if (c + 1 < N && hk[c + 1] < hk[c]) c++;
        if (hk[c] >= lk) break; hk[i] = hk[c]; hn[i] = hn[c]; i = c; }
      hk[i] = lk; hn[i] = ln;
    }
    if (d > dist[u] + h(u) + 1e-6) continue;
    if (u === dst) break;
    const du = dist[u];
    for (let e = off[u]; e < off[u + 1]; e++) {
      const v = to[e]; let w = len[e];
      if (seg) {
        const dv = distPointSeg((X[u] + X[v]) / 2, (Y[u] + Y[v]) / 2, seg[0], seg[1], seg[2], seg[3]);
        if (dv > cutoff) continue;
        const q = dv / sigma; w *= 1 + q * q;
      }
      const nd = du + w;
      if (stamp[v] !== T || nd < dist[v]) {
        stamp[v] = T; dist[v] = nd; prev[v] = u;
        const f = nd + h(v);
        let i = hn.length; hk.push(f); hn.push(v); // sift up
        while (i > 0) { const p = (i - 1) >> 1; if (hk[p] <= f) break; hk[i] = hk[p]; hn[i] = hn[p]; i = p; }
        hk[i] = f; hn[i] = v;
      }
    }
  }
  if (stamp[dst] !== T) return null;
  const path = []; for (let v = dst; v !== -1; v = prev[v]) path.push(v);
  return path.reverse();
}

function pathLength(g, nodes) {
  let s = 0; for (let i = 1; i < nodes.length; i++) s += Math.hypot(g.X[nodes[i]] - g.X[nodes[i - 1]], g.Y[nodes[i]] - g.Y[nodes[i - 1]]);
  return s;
}

// strokes: arrays of [lat,lon]. Returns parts (letter strokes + links between them), length and fit score (mean metres off the ideal line).
function routeWord(g, strokes, H) {
  const sigma = Math.max(20, Math.min(100, H * 0.05)), cutoff = Math.max(250, H * 0.45);
  const parts = []; let last = -1, devSum = 0, lenSum = 0, total = 0;
  for (const st of strokes) {
    const pts = st.map(p => g.toXY(p[0], p[1]));
    const anc = pts.map(p => g.nearest(p[0], p[1]));
    if (anc.some(a => a < 0)) return null;
    if (last >= 0 && last !== anc[0]) {
      const link = shortest(g, last, anc[0], null);
      if (!link) return null;
      parts.push({ type: "link", nodes: link }); total += pathLength(g, link);
    }
    const nodes = [anc[0]];
    for (let i = 0; i + 1 < pts.length; i++) {
      const seg = [pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]];
      devSum += Math.hypot(g.X[anc[i + 1]] - seg[2], g.Y[anc[i + 1]] - seg[3]) * sigma;
      lenSum += sigma;
      if (anc[i] === anc[i + 1]) continue;
      const p = shortest(g, anc[i], anc[i + 1], seg, sigma, cutoff) || shortest(g, anc[i], anc[i + 1], seg, sigma, Infinity);
      if (!p) return null;
      for (let j = 1; j < p.length; j++) {
        const u = p[j - 1], v = p[j], l = Math.hypot(g.X[u] - g.X[v], g.Y[u] - g.Y[v]);
        devSum += l * distPointSeg((g.X[u] + g.X[v]) / 2, (g.Y[u] + g.Y[v]) / 2, seg[0], seg[1], seg[2], seg[3]);
        lenSum += l; total += l; nodes.push(v);
      }
    }
    parts.push({ type: "stroke", nodes }); last = nodes[nodes.length - 1];
  }
  return { parts, length: total, score: lenSum ? devSum / lenSum : 0 };
}

function toGPX(g, parts, name) {
  const esc = s => s.replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
  let out = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Word Route" xmlns="http://www.topografix.com/GPX/1/1">\n' +
    "<trk><name>" + esc(name) + "</name><trkseg>\n", lastNode = -1;
  for (const p of parts) for (const k of p.nodes) {
    if (k === lastNode) continue; lastNode = k;
    out += '<trkpt lat="' + g.lat[k].toFixed(6) + '" lon="' + g.lon[k].toFixed(6) + '"/>\n';
  }
  return out + "</trkseg></trk>\n</gpx>\n";
}
// ---------- street data from vector tiles ----------
const WORLD = 16384 * 4096; // global pixel grid at zoom 14, 4096 units per tile
const gx2lon = gx => gx / WORLD * 360 - 180;
const gy2lat = gy => Math.atan(Math.sinh(Math.PI * (1 - 2 * gy / WORLD))) / RAD;
// lines: arrays of [gx,gy] integer points. Joins lines that touch without sharing a vertex
// (tile edges, simplified junctions) and returns way elements for buildGraph.
function linesToElements(lines, TOL = 2) {
  const K = 67108864, CELL = 256 * Math.max(1, TOL / 2), grid = new Map(), seen = new Map();
  for (const ln of lines) for (let i = 0; i < ln.length; i++) {
    const p = ln[i]; seen.set(p[0] * K + p[1], p);
    if (!i) continue;
    const a = ln[i - 1]; if (a[0] === p[0] && a[1] === p[1]) continue;
    const x0 = Math.floor((Math.min(a[0], p[0]) - TOL) / CELL), x1 = Math.floor((Math.max(a[0], p[0]) + TOL) / CELL);
    const y0 = Math.floor((Math.min(a[1], p[1]) - TOL) / CELL), y1 = Math.floor((Math.max(a[1], p[1]) + TOL) / CELL);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
      const k = cx + "," + cy; let g = grid.get(k); if (!g) grid.set(k, g = []); g.push([a, p]);
    }
  }
  const out = lines.slice();
  for (const p of seen.values()) {
    const segs = grid.get(Math.floor(p[0] / CELL) + "," + Math.floor(p[1] / CELL)); if (!segs) continue;
    for (const [a, b] of segs) {
      if ((a[0] === p[0] && a[1] === p[1]) || (b[0] === p[0] && b[1] === p[1])) continue;
      if (distPointSeg(p[0], p[1], a[0], a[1], b[0], b[1]) <= TOL) out.push([a, p, b]);
    }
  }
  return out.map(ln => ({ type: "way", nodes: ln.map(q => q[0] * K + q[1]), geometry: ln.map(q => ({ lat: gy2lat(q[1]), lon: gx2lon(q[0]) })) }));
}
/*CORE-END*/

// ---------- page ----------
const $ = id => document.getElementById(id);
const map = L.map("map", { zoomControl: true }).setView([37.9755, 23.7348], 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const state = { center: map.getCenter(), mode: "run", graph: null, graphBox: null, graphMode: null, result: null, busy: false };
const ghost = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
const handle = L.marker(state.center, { draggable: true, zIndexOffset: 1000,
  icon: L.divIcon({ className: "", html: '<div class="handle">✥</div>', iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(map);

const H = () => +$("size").value, ROT = () => +$("rot").value;
function setStatus(t, err) { $("status").textContent = t; $("status").className = err ? "err" : ""; }
function currentStrokes(c = state.center, rot = ROT()) {
  const lay = layoutWord($("word").value);
  return { lay, strokes: placeStrokes(lay.strokes, c, H(), rot) };
}
function boxOf(strokes, pad) {
  let s = 90, n = -90, w = 180, e = -180;
  for (const st of strokes) for (const p of st) { s = Math.min(s, p[0]); n = Math.max(n, p[0]); w = Math.min(w, p[1]); e = Math.max(e, p[1]); }
  const dLat = pad / R / RAD, dLon = pad / (R * Math.cos(s * RAD)) / RAD;
  return { s: s - dLat, n: n + dLat, w: w - dLon, e: e + dLon };
}
const covers = (a, b) => a && a.s <= b.s && a.n >= b.n && a.w <= b.w && a.e >= b.e;
const margin = () => Math.max(250, H() * 0.3);

function drawGhost() {
  $("sizeO").textContent = H() >= 1000 ? (H() / 1000).toFixed(2) + " km" : H() + " m";
  $("rotO").textContent = ROT() + "°";
  ghost.clearLayers();
  const { strokes } = currentStrokes();
  for (const s of strokes) L.polyline(s, { color: "#14181f", weight: 3, opacity: state.result ? 0.25 : 0.7, dashArray: "2 7" }).addTo(ghost);
}
function clearRoute() {
  state.result = null; routeLayer.clearLayers(); $("stats").textContent = ""; $("gpx").disabled = true; $("tune").disabled = true;
}
function drawRoute() {
  routeLayer.clearLayers();
  const g = state.graph, r = state.result; if (!r) return;
  const ll = nodes => nodes.map(k => [g.lat[k], g.lon[k]]);
  for (const p of r.parts) if (p.type === "link") L.polyline(ll(p.nodes), { color: "#ff4d2e", weight: 3, opacity: 0.55, dashArray: "6 8" }).addTo(routeLayer);
  for (const p of r.parts) if (p.type === "stroke") L.polyline(ll(p.nodes), { color: "#ff4d2e", weight: 6, opacity: 0.92, lineJoin: "round" }).addTo(routeLayer);
  const first = r.parts[0].nodes[0], lp = r.parts[r.parts.length - 1].nodes, end = lp[lp.length - 1];
  L.circleMarker([g.lat[first], g.lon[first]], { radius: 7, color: "#fff", weight: 2, fillColor: "#3ddc97", fillOpacity: 1 }).addTo(routeLayer).bindTooltip("Start");
  L.circleMarker([g.lat[end], g.lon[end]], { radius: 7, color: "#fff", weight: 2, fillColor: "#14181f", fillOpacity: 1 }).addTo(routeLayer).bindTooltip("Finish");
  const km = r.length / 1000, mins = state.mode === "run" ? km * 6 : km / 18 * 60;
  const t = mins >= 60 ? Math.floor(mins / 60) + "h " + String(Math.round(mins % 60)).padStart(2, "0") + "m" : Math.round(mins) + " min";
  $("stats").textContent = km.toFixed(1) + " km · ~" + t + " · avg " + Math.round(r.score) + " m off the letters";
  $("gpx").disabled = false; $("tune").disabled = false;
  drawGhost();
}

// Streets come from OpenFreeMap vector tiles (OpenStreetMap data, zoom 14).
let tileLibs, tileURL; const tileCache = new Map();
function wanted(p, mode) {
  const c = p.class, sub = p.subclass;
  if (c === "primary" || c === "secondary" || c === "tertiary" || c === "minor" || c === "track") return true;
  if (c === "path") return mode === "run" ? sub !== "platform" : (sub === "cycleway" || sub === "path" || sub === "pedestrian");
  return false;
}
async function fetchRoads(b, mode) {
  if (!tileLibs) {
    const [vt, pbf] = await Promise.all([import("https://esm.sh/@mapbox/vector-tile@1.3.1"), import("https://esm.sh/pbf@3.2.1")]);
    tileLibs = { VectorTile: vt.VectorTile, Pbf: pbf.default };
  }
  if (!tileURL) tileURL = (await (await fetch("https://tiles.openfreemap.org/planet")).json()).tiles[0];
  // Small words use full-detail zoom-14 tiles; big words drop to zoom 13/12, which keep the
  // through roads and skip the tiny alleys (plenty for letters several km tall).
  let z, x0, x1, y0, y1;
  for (z = 14; z >= 12; z--) {
    const n = 2 ** z, lat2y = lat => { const r = lat * RAD; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n; };
    x0 = Math.floor((b.w + 180) / 360 * n); x1 = Math.floor((b.e + 180) / 360 * n);
    y0 = Math.floor(lat2y(b.n)); y1 = Math.floor(lat2y(b.s));
    if ((x1 - x0 + 1) * (y1 - y0 + 1) <= 16) break;
  }
  if (z < 12) throw new Error("too big");
  const scale = 4096 * 2 ** (14 - z), lines = [];
  const jobs = [];
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) jobs.push([x, y]);
  await Promise.all(jobs.map(async ([x, y]) => {
    const key = z + "/" + x + "/" + y;
    let buf = tileCache.get(key);
    if (!buf) {
      const res = await fetch(tileURL.replace("{z}", z).replace("{x}", x).replace("{y}", y));
      if (!res.ok) throw new Error("HTTP " + res.status);
      buf = new Uint8Array(await res.arrayBuffer());
      if (tileCache.size > 60) tileCache.delete(tileCache.keys().next().value);
      tileCache.set(key, buf);
    }
    const layer = new tileLibs.VectorTile(new tileLibs.Pbf(buf)).layers.transportation;
    if (!layer) return;
    const k = scale / layer.extent;
    for (let i = 0; i < layer.length; i++) {
      const f = layer.feature(i);
      if (f.type !== 2 || !wanted(f.properties, mode)) continue;
      for (const g of f.loadGeometry()) lines.push(g.map(q => [Math.round(x * scale + q.x * k), Math.round(y * scale + q.y * k)]));
    }
  }));
  return { elements: linesToElements(lines, 2 * 2 ** (14 - z)),
    box: { w: gx2lon(x0 * scale), e: gx2lon((x1 + 1) * scale), n: gy2lat(y0 * scale), s: gy2lat((y1 + 1) * scale) } };
}

// Route with what is loaded; returns false if road data is missing for this placement.
function routeNow() {
  const { strokes } = currentStrokes();
  if (!strokes.length || !state.graph || state.graphMode !== state.mode || !covers(state.graphBox, boxOf(strokes, margin()))) return false;
  const r = routeWord(state.graph, strokes, H());
  if (!r) { clearRoute(); setStatus("Couldn't connect the letters on the streets here — try moving or resizing the word.", true); return true; }
  state.result = r; drawRoute();
  setStatus(r.score > H() * 0.12 ? "Rough fit — try a bigger letter size, a small rotation, or Improve fit." : "Looks rideable. Drag, rotate or resize to adjust.");
  return true;
}
function changed() { drawGhost(); if (state.busy) return; if (state.result && !routeNow()) { clearRoute(); drawGhost(); setStatus("Moved outside the loaded streets — press Make route."); } }

async function make() {
  if (state.busy) return;
  const { lay, strokes } = currentStrokes();
  if (!strokes.length) return setStatus("Type a word first (A–Z, Α–Ω, 0–9, ♥).", true);
  if (!routeNow()) {
    const box = boxOf(strokes, margin() + 100);
    state.busy = true; $("go").disabled = true; setStatus("Loading streets from OpenStreetMap…");
    await new Promise(r => setTimeout(r, 30));
    try {
      const data = await fetchRoads(box, state.mode);
      const g = buildGraph(data.elements);
      if (!g) throw new Error("no streets");
      state.graph = g; state.graphBox = data.box; state.graphMode = state.mode;
    } catch (e) {
      state.busy = false; $("go").disabled = false; clearRoute();
      return setStatus(e.message === "no streets" ? "No streets found here — move the word onto a city."
        : e.message === "too big" ? "That covers too large an area. Use smaller letters or a shorter word."
        : "Couldn't load street data (" + e.message + "). Try again in a moment.", true);
    }
    setStatus("Tracing the letters…");
    await new Promise(r => setTimeout(r, 30));
    state.busy = false; $("go").disabled = false;
    routeNow();
  }
  if (lay.skipped.length) setStatus("Skipped unsupported characters: " + [...new Set(lay.skipped)].join(" "), true);
}

// Try nearby positions and rotations, keep whichever follows the letters most closely.
async function tune() {
  if (state.busy || !state.result) return;
  state.busy = true; $("tune").disabled = true; $("go").disabled = true;
  const lay = layoutWord($("word").value), h = H(), step = Math.min(h * 0.1, 120), c0 = state.center, r0 = ROT();
  const cl = Math.cos(c0.lat * RAD);
  let best = { score: state.result.score, c: c0, rot: r0, res: state.result }, i = 0; const t0 = performance.now();
  const cands = [];
  for (const dr of [0, -3, 3, -6, 6]) for (const dx of [0, -1, 1]) for (const dy of [0, -1, 1]) if (dr || dx || dy) cands.push([dr, dx, dy]);
  for (const [dr, dx, dy] of cands) {
    const rot = Math.max(-90, Math.min(90, r0 + dr));
    const c = L.latLng(c0.lat + dy * step / R / RAD, c0.lng + dx * step / (R * cl) / RAD);
    const strokes = placeStrokes(lay.strokes, c, h, rot);
    if (covers(state.graphBox, boxOf(strokes, margin()))) {
      const res = routeWord(state.graph, strokes, h);
      if (res && res.score < best.score) best = { score: res.score, c, rot, res };
    }
    setStatus("Trying nearby placements… " + Math.round(++i / cands.length * 100) + "%");
    await new Promise(r => setTimeout(r));
    if (performance.now() - t0 > 20000) break;
  }
  const gain = state.result.score - best.score;
  state.center = best.c; handle.setLatLng(best.c); $("rot").value = best.rot; state.result = best.res;
  state.busy = false; $("go").disabled = false;
  drawRoute();
  setStatus(gain > 0.5 ? "Better fit found (" + Math.round(gain) + " m closer on average). Press again to keep searching." : "This is already the best fit nearby.");
}

function download() {
  if (!state.result) return;
  const name = normalizeWord($("word").value).trim() || "word";
  const url = URL.createObjectURL(new Blob([toGPX(state.graph, state.result.parts, name + " (" + state.mode + ")")], { type: "application/gpx+xml" }));
  const a = document.createElement("a"); a.href = url; a.download = name.replace(/[^\p{L}\p{N}]+/gu, "_") + ".gpx";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}

handle.on("drag", () => { state.center = handle.getLatLng(); drawGhost(); });
handle.on("dragend", changed);
$("word").addEventListener("input", () => { clearRoute(); drawGhost(); });
$("word").addEventListener("keydown", e => { if (e.key === "Enter") { e.target.blur(); make(); } });
$("size").addEventListener("input", drawGhost); $("rot").addEventListener("input", drawGhost);
$("size").addEventListener("change", changed); $("rot").addEventListener("change", changed);
$("here").addEventListener("click", () => { state.center = map.getCenter(); handle.setLatLng(state.center); changed(); });
$("go").addEventListener("click", make); $("tune").addEventListener("click", tune); $("gpx").addEventListener("click", download);
$("mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.mode = b.dataset.m;
  for (const x of $("mode").children) x.classList.toggle("on", x === b);
  if (state.result) { clearRoute(); drawGhost(); make(); }
});
$("top").addEventListener("submit", async e => {
  e.preventDefault(); const q = $("place").value.trim(); if (!q) return;
  try {
    const j = await (await fetch("https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(q))).json();
    if (!j.features || !j.features.length) return setStatus("Couldn't find “" + q + "”.", true);
    const [lon, lat] = j.features[0].geometry.coordinates;
    map.setView([lat, lon], 14); state.center = L.latLng(lat, lon); handle.setLatLng(state.center);
    clearRoute(); drawGhost(); $("place").blur(); setStatus("Place the word, then make the route.");
  } catch (err) { setStatus("Place search isn't reachable right now.", true); }
});
drawGhost();
</script>
</body>
</html>
